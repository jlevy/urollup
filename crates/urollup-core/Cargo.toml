[package]
name = "urollup-core"
description = "The urollup accounting core: session log ingestion, reconciliation and usage rollups"
readme = "README.md"
documentation = "https://docs.rs/urollup-core"
keywords = ["usage", "tokens", "claude", "codex", "rollup"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
include = ["src/**", "Cargo.toml", "README.md"]

[lib]
name = "urollup_core"
path = "src/lib.rs"

# No CLI, HTTP or async-runtime dependencies, ever (design §8.1). The CI dependency guard
# (`make dependency-guard`) fails if one appears in this crate's tree.
[dependencies]
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
zstd = { version = "0.13.3", default-features = false }

[lints]
workspace = true

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"
