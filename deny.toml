# Adapted from fdu `deny.toml` at afbb2ee; see PROVENANCE.md.
# Dependency policy, run by `make audit` (cargo-deny) and the CI dependency-audit job.

[graph]
# Audit every feature, so optional dependencies behind `serve` are covered too.
all-features = true

[advisories]
version = 2
# No ignores. Any entry added here must name the tbd bead that tracks it and the condition
# under which it can be removed (design §8.2).
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
]
# The list above is the set of permissive licenses this project accepts, not an inventory
# of what the tree contains today. Warning about unused entries would only train readers
# to skim the audit's output.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
# The tree is deliberately small: clap in the executable, nothing in the core. HTTP and
# async-runtime crates may enter only as optional `serve` dependencies; the dependency
# guard (`make dependency-guard`) enforces that boundary, since bans here cannot tell a
# feature-gated dependency from an always-on one.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
