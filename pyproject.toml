# Development-only Python tooling for urollup. Nothing here is a runtime or build
# dependency of the Rust crates. Run tools with `uv --config-file uv.toml run --frozen <tool>`.
[project]
name = "urollup-dev"
version = "0.0.0"
requires-python = ">=3.12"

[dependency-groups]
dev = ["softschema==0.8.1", "flowmark-rs==0.4.0"]
# The release build tool: Maturin packages the urollup executable as a `bindings = "bin"`
# wheel (crates/urollup/pyproject.toml). Installed only for release jobs, with
# `--group release`.
release = ["maturin==1.15.0"]

[tool.uv]
package = false
# Resolution settings (cool-off and first-party exemptions) live in uv.toml; run uv with
# `--config-file uv.toml`.
