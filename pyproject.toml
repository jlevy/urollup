# Development-only Python tooling for urollup. Nothing here is a runtime or build
# dependency of the Rust crates. Run tools with `uv run --frozen <tool>`.
[project]
name = "urollup-dev"
version = "0.0.0"
requires-python = ">=3.12"

[dependency-groups]
dev = ["softschema==0.8.1"]

[tool.uv]
package = false
# Supply-chain cool-off (tbd supply-chain-hardening): resolve only releases at least
# 14 days old. uv 0.12.1 or newer is required to parse the relative duration.
exclude-newer = "14 days"

# First-party packages are exempt from the cool-off by identity; lockfile hashes still
# apply.
[tool.uv.exclude-newer-package]
softschema = "2099-12-31"
